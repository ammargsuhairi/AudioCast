<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AudioCast</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0e1116; color: #e8eaed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 420px; padding: 24px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .sub { margin: 0 0 24px; color: #9aa0a6; font-size: 14px; }
  #status { padding: 12px 14px; border-radius: 12px; background: #1a1f27; margin-bottom: 20px; font-size: 15px; }
  #status.ok { background: #12301f; color: #8be0a8; }
  #status.err { background: #3a1818; color: #f4a3a3; }
  button {
    width: 100%; padding: 18px; font-size: 18px; font-weight: 600; border: 0; border-radius: 14px;
    background: #3b82f6; color: #fff;
  }
  button.stop { background: #ef4444; }
  label { display: block; margin-top: 22px; font-size: 14px; color: #c4c7cc; }
  input[type=range] { width: 100%; margin-top: 8px; }
  .hint { margin-top: 26px; font-size: 12px; line-height: 1.5; color: #8a8f98; }
</style>
</head>
<body>
<main>
  <h1>AudioCast</h1>
  <p class="sub">Dengerin audio dari Android di iPhone ini</p>
  <div id="status">Siap. Tap tombol di bawah buat mulai.</div>
  <button id="go">Mulai dengar</button>

  <label>Volume (bisa sampai 3x, berguna buat mode mic)
    <input id="vol" type="range" min="0" max="3" step="0.05" value="1">
  </label>
  <label>Buffer: <span id="bufv">200</span> ms (naikin kalau suara putus-putus)
    <input id="buf" type="range" min="60" max="600" step="10" value="200">
  </label>

  <p class="hint">
    Kalau nggak ada suara: matiin mode silent (switch di samping iPhone), naikin volume,
    dan biarin layar tetap nyala dengan Safari di depan.
  </p>
  <audio id="keep" playsinline></audio>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let ctx = null, gain = null, ws = null, wakeLock = null;
  let started = false, nextTime = 0, rate = 44100, ch = 2;
  let target = 0.2;

  function setStatus(text, cls) {
    const el = $('status');
    el.textContent = text;
    el.className = cls || '';
  }

  function silentWav() {
    const sr = 8000, n = sr / 2;
    const b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true);
    v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    return new Blob([b], { type: 'audio/wav' });
  }

  async function start() {
    started = true;
    $('go').textContent = 'Berhenti';
    $('go').className = 'stop';
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    try { await ctx.resume(); } catch (e) {}
    gain = ctx.createGain();
    gain.gain.value = parseFloat($('vol').value);
    gain.connect(ctx.destination);

    // Biar suara tetap keluar walau switch silent nyala dan audio session jadi "playback".
    try { navigator.audioSession.type = 'playback'; } catch (e) {}
    const keep = $('keep');
    keep.src = URL.createObjectURL(silentWav());
    keep.loop = true;
    keep.play().catch(() => {});

    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    connect();
  }

  function stop() {
    started = false;
    $('go').textContent = 'Mulai dengar';
    $('go').className = '';
    try { ws && ws.close(); } catch (e) {}
    try { ctx && ctx.close(); } catch (e) {}
    try { $('keep').pause(); } catch (e) {}
    try { wakeLock && wakeLock.release(); } catch (e) {}
    ctx = null; ws = null; nextTime = 0;
    setStatus('Berhenti.');
  }

  function connect() {
    if (!started) return;
    setStatus('Nyambung ke Android...');
    ws = new WebSocket('ws://' + location.host + '/ws');
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => { nextTime = 0; setStatus('Terhubung. Putar audio di Android.', 'ok'); };
    ws.onmessage = (e) => {
      if (typeof e.data === 'string') {
        try { const m = JSON.parse(e.data); rate = m.rate; ch = m.ch; } catch (err) {}
        return;
      }
      play(e.data);
    };
    ws.onerror = () => setStatus('Gagal nyambung. Cek hotspot dan app di Android.', 'err');
    ws.onclose = () => {
      if (!started) return;
      setStatus('Terputus, nyoba nyambung lagi...', 'err');
      setTimeout(connect, 1000);
    };
  }

  function play(buf) {
    if (!ctx) return;
    const i16 = new Int16Array(buf);
    const frames = Math.floor(i16.length / ch);
    if (frames === 0) return;
    const now = ctx.currentTime;

    // Kalau antrean udah kejauhan dari target, buang chunk biar delay nggak numpuk.
    if (nextTime > now + target + 0.3) return;
    // Kalau kehabisan buffer, mulai ulang dengan jarak aman.
    if (nextTime < now + 0.02) nextTime = now + target;

    const ab = ctx.createBuffer(ch, frames, rate);
    for (let c = 0; c < ch; c++) {
      const d = ab.getChannelData(c);
      for (let i = 0; i < frames; i++) d[i] = i16[i * ch + c] / 32768;
    }
    const src = ctx.createBufferSource();
    src.buffer = ab;
    src.connect(gain);
    src.start(nextTime);
    nextTime += ab.duration;
  }

  $('go').addEventListener('click', () => { started ? stop() : start(); });
  $('vol').addEventListener('input', (e) => { if (gain) gain.gain.value = parseFloat(e.target.value); });
  $('buf').addEventListener('input', (e) => {
    target = parseInt(e.target.value, 10) / 1000;
    $('bufv').textContent = e.target.value;
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && ctx) { ctx.resume().catch(() => {}); }
    if (!document.hidden && started && !wakeLock) { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => wakeLock = l).catch(() => {}); }
  });
})();
</script>
</body>
</html>
